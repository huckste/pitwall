name: Get NASCAR event sessions
method: GET
url: $api/nascar/events/:eventId/sessions
timeout: 30000
followRedirects: true
maxRedirects: 5
path_params:
  - name: eventId
    value: $nascar_event_id
capture:
  nascar_session_id:
    value: body[2].id
    persist: environment
auth:
  type: api_key
  key: X-API-KEY
  value: $API_KEY
  placement: header

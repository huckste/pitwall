name: Get NASCAR session stages
method: GET
url: $api/nascar/events/:eventId/sessions/:sessionId/stages
timeout: 30000
followRedirects: true
maxRedirects: 5
path_params:
  - name: eventId
    value: $nascar_event_id
  - name: sessionId
    value: $nascar_session_id
auth:
  type: api_key
  key: X-API-KEY
  value: $API_KEY
  placement: header

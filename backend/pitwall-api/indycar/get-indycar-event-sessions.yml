name: Get IndyCar event sessions
method: GET
url: $api/indycar/events/:eventId/sessions
timeout: 30000
followRedirects: true
maxRedirects: 5
path_params:
  - name: eventId
    value: $indycar_event_id
capture:
  indycar_session_id:
    value: body[4].id
    persist: environment
auth:
  type: api_key
  key: X-API-KEY
  value: $API_KEY
  placement: header

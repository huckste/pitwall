name: Get F1 drivers
method: GET
url: $api/formula1/drivers
timeout: 30000
followRedirects: true
maxRedirects: 5
params:
  - name: page
    value: '1'
  - name: limit
    value: '20'
capture:
  f1_driver_id:
    value: body.data[0].id
    persist: environment
auth:
  type: api_key
  key: X-API-KEY
  value: $API_KEY
  placement: header

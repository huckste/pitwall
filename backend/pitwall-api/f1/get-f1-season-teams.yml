name: Get F1 season teams
method: GET
url: $api/formula1/seasons/:seasonId/teams
timeout: 30000
followRedirects: true
maxRedirects: 5
path_params:
  - name: seasonId
    value: $f1_season_id
capture:
  f1_team_id:
    value: body[0].id
    persist: environment
auth:
  type: api_key
  key: X-API-KEY
  value: $API_KEY
  placement: header

name: Get F1 event sessions
method: GET
url: $api/formula1/events/:eventId/sessions
timeout: 30000
followRedirects: true
maxRedirects: 5
path_params:
  - name: eventId
    value: $f1_event_id
capture:
  f1_session_id:
    value: body[4].id
    persist: environment
auth:
  type: api_key
  key: X-API-KEY
  value: $API_KEY
  placement: header

name: Get NASCAR Truck session stages
method: GET
url: $api/nascar-truck/events/:eventId/sessions/:sessionId/stages
timeout: 30000
followRedirects: true
maxRedirects: 5
path_params:
  - name: eventId
    value: $nascar_truck_event_id
  - name: sessionId
    value: $nascar_truck_session_id
auth:
  type: api_key
  key: X-API-KEY
  value: $API_KEY
  placement: header

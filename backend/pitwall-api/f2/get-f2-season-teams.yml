name: Get F2 season teams
method: GET
url: $api/formula2/seasons/:seasonId/teams
timeout: 30000
followRedirects: true
maxRedirects: 5
path_params:
  - name: seasonId
    value: $f2_season_id
capture:
  f2_team_id:
    value: body[0].id
    persist: environment
auth:
  type: api_key
  key: X-API-KEY
  value: $API_KEY
  placement: header

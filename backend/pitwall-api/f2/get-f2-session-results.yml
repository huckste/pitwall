name: Get F2 session results
method: GET
url: $api/formula2/events/:eventId/sessions/:sessionId
timeout: 30000
followRedirects: true
maxRedirects: 5
path_params:
  - name: eventId
    value: $f2_event_id
  - name: sessionId
    value: $f2_session_id
auth:
  type: api_key
  key: X-API-KEY
  value: $API_KEY
  placement: header

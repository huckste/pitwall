name: Get WEC events
method: GET
url: $api/wec/events
timeout: 30000
followRedirects: true
maxRedirects: 5
params:
  - name: page
    value: '1'
  - name: limit
    value: '50'
capture:
  wec_event_id:
    value: body.data[3].id
    persist: environment
auth:
  type: api_key
  key: X-API-KEY
  value: $API_KEY
  placement: header

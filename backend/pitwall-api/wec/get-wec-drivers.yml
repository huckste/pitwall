name: Get WEC drivers
method: GET
url: $api/wec/drivers
timeout: 30000
followRedirects: true
maxRedirects: 5
params:
  - name: page
    value: '1'
  - name: limit
    value: '20'
capture:
  wec_driver_id:
    value: body.data[16].id
    persist: environment
auth:
  type: api_key
  key: X-API-KEY
  value: $API_KEY
  placement: header

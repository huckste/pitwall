name: Get WEC season teams
method: GET
url: $api/wec/seasons/:seasonId/teams
timeout: 30000
followRedirects: true
maxRedirects: 5
path_params:
  - name: seasonId
    value: $wec_season_id
capture:
  wec_team_id:
    value: body[0].id
    persist: environment
auth:
  type: api_key
  key: X-API-KEY
  value: $API_KEY
  placement: header

name: Get WEC event sessions
method: GET
url: $api/wec/events/:eventId/sessions
timeout: 30000
followRedirects: true
maxRedirects: 5
path_params:
  - name: eventId
    value: $wec_event_id
capture:
  wec_session_id:
    value: body[11].id
    persist: environment
auth:
  type: api_key
  key: X-API-KEY
  value: $API_KEY
  placement: header

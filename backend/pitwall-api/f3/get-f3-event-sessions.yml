name: Get F3 event sessions
method: GET
url: $api/formula3/events/:eventId/sessions
timeout: 30000
followRedirects: true
maxRedirects: 5
path_params:
  - name: eventId
    value: $f3_event_id
capture:
  f3_session_id:
    value: body[6].id
    persist: environment
auth:
  type: api_key
  key: X-API-KEY
  value: $API_KEY
  placement: header
